<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세기말일보 1890–2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 연도별 1면 6장을 위에서 아래로 쌓은 국한문 신문 — 제호, 머리기사 1단 + 나머지 9건 3단 그리드, 상단 고정 연도 색인 */
:root{
  --paper:#efe9dc; --paper-edge:#e2dac8; --ink:#1d1a16; --ink-soft:#4a4439; --rule:#2a251e;
  --red:#a8231b; --muted:#7a7262;
  --f-mast:"Black Han Sans","Noto Serif KR",serif;
  --f-head:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Nanum Myeongjo","Noto Serif KR",serif;
  --f-data:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1c1a17; --paper-edge:#26231e; --ink:#e9e3d4; --ink-soft:#bdb5a3; --rule:#d9d1bf;
  --red:#e0675c; --muted:#948b78; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1c1a17; --paper-edge:#26231e; --ink:#e9e3d4; --ink-soft:#bdb5a3; --rule:#d9d1bf;
  --red:#e0675c; --muted:#948b78; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper-edge);color:var(--ink);font-family:var(--f-body);line-height:1.7;padding-inline:16px;padding-block:0 48px}
a{color:inherit}
.yearnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper-edge);border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;padding-block:10px;margin-inline:-16px;padding-inline:16px;font-family:var(--f-data);font-size:13px}
.yearnav a{text-decoration:none;color:var(--ink-soft);padding:2px 4px;border-bottom:2px solid transparent}
.yearnav a:hover,.yearnav a:focus-visible{color:var(--red);border-bottom-color:var(--red);outline:none}
.issue{max-width:1080px;margin:28px auto 0;background:var(--paper);padding:28px clamp(16px,4vw,44px) 36px;box-shadow:0 1px 0 var(--rule),0 10px 30px -18px rgba(0,0,0,.35);scroll-margin-top:56px}
/* 제호 */
.masthead{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;border-bottom:4px double var(--rule);padding-bottom:10px}
.ear{font-family:var(--f-data);font-size:11px;color:var(--ink-soft);line-height:1.5;letter-spacing:.02em}
.ear.r{text-align:right}
.ear b{color:var(--red);font-weight:500}
.title{font-family:var(--f-mast);font-size:clamp(40px,8vw,84px);line-height:1;letter-spacing:.04em;text-align:center;margin:0}
.title small{display:block;font-family:var(--f-head);font-size:.18em;letter-spacing:.6em;margin-top:6px;color:var(--ink-soft);font-weight:600}
.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;border-bottom:1px solid var(--rule);padding:6px 0;font-family:var(--f-data);font-size:12px;color:var(--ink-soft)}
.dateline .yr{color:var(--ink);font-weight:500}
/* 머리기사 */
.lead{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;padding:22px 0 20px;border-bottom:2px solid var(--rule)}
.kicker{font-family:var(--f-data);font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.lead h2{font-family:var(--f-head);font-weight:900;font-size:clamp(30px,5.4vw,58px);line-height:1.12;margin:6px 0 12px;text-wrap:balance;letter-spacing:-.02em}
.lead .deck{font-family:var(--f-head);font-weight:600;font-size:clamp(16px,2vw,20px);line-height:1.5;color:var(--ink-soft);margin:0 0 12px;text-wrap:balance}
.lead .body{column-count:2;column-gap:22px;column-rule:1px solid var(--muted);font-size:15px;text-align:justify;margin:0}
.lead .body::first-letter{font-family:var(--f-head);font-weight:900;font-size:3.1em;float:left;line-height:.9;margin:4px 6px 0 0}
.lead.solo{grid-template-columns:minmax(0,1fr)}
.lead.solo .body{column-count:3}
.lead aside{border-left:1px solid var(--rule);padding-left:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fig{border:1px solid var(--rule);padding:14px;text-align:center}
.fig .n{font-family:var(--f-mast);font-size:clamp(40px,6vw,64px);line-height:1;color:var(--red)}
.fig .l{font-size:13px;color:var(--ink-soft);margin-top:6px}
.quote{font-family:var(--f-head);font-weight:600;font-size:18px;line-height:1.5;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin:0}
.quote cite{display:block;font-family:var(--f-data);font-style:normal;font-size:11px;color:var(--muted);margin-top:6px}
.meta{font-family:var(--f-data);font-size:11px;color:var(--muted);letter-spacing:.04em}
/* 나머지 9건 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-top:18px}
.story{padding:0 18px 18px;border-left:1px solid var(--muted);min-width:0}
.story:nth-child(3n+1){border-left:0;padding-left:0}
.story:nth-child(3n){padding-right:0}
.story:nth-child(n+4){border-top:1px solid var(--muted);padding-top:16px}
.story .no{font-family:var(--f-data);font-size:11px;color:var(--red);letter-spacing:.06em}
.story h3{font-family:var(--f-head);font-weight:900;font-size:21px;line-height:1.3;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
.story:nth-child(-n+3) h3{font-size:24px}
.story p{margin:0;font-size:14.5px;text-align:justify;color:var(--ink)}
.story .meta{margin-top:8px}
.foot{margin-top:18px;border-top:4px double var(--rule);padding-top:8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-family:var(--f-data);font-size:11px;color:var(--muted)}
.colophon{max-width:1080px;margin:28px auto 0;font-size:12.5px;color:var(--ink-soft);font-family:var(--f-data);line-height:1.6}
@media (max-width:860px){
  .lead.solo .body{column-count:2}
  .lead{grid-template-columns:minmax(0,1fr)}
  .lead aside{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:start}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .story,.story:nth-child(n){border-left:1px solid var(--muted);padding:16px 14px 16px;border-top:1px solid var(--muted)}
  .story:nth-child(odd){border-left:0;padding-left:0}
  .story:nth-child(even){padding-right:0}
  .story:nth-child(-n+2){border-top:0;padding-top:0}
}
@media (max-width:560px){
  .yearnav{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .masthead{grid-template-columns:1fr}
  .ear,.ear.r{text-align:center}
  .ear.r{display:none}
  .lead .body,.lead.solo .body{column-count:1}
  .lead aside{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .story,.story:nth-child(n){border-left:0;padding:14px 0;border-top:1px solid var(--muted)}
  .story:first-child{border-top:0;padding-top:0}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
<style>body{margin:0;font-size:14px}</style>
</head>

 lead:{kicker:"사법 · 8월 26일", h:"전두환 사형, 노태우 징역 22년 6월", deck:"12·12와 5·18 ‘성공한 쿠데타도 처벌’… 두 전직 대통령 나란히 법정에",
  body:"서울지법은 군형법상 반란 수괴, 내란 수괴 등의 혐의로 전두환 전 대통령에게 사형, 노태우 전 대통령에게 징역 22년 6월을 선고했다. 수의를 입고 손을 맞잡은 두 사람의 사진은 한 시대의 종언을 상징했다. 12월 항소심에서 각각 무기징역과 징역 17년으로 감형됐고, 이듬해 대법원에서 확정된다.",
  fig:["2,205억","전두환 추징금 (1997년 대법원 확정)"], quote:["“성공한 쿠데타도 처벌할 수 있다.”","재판부 판단 취지"]},
 items:[
  ["안보 · 9.18","강릉 북한 잠수함 침투","좌초한 잠수함에서 무장공비 26명이 침투해 49일간 소탕 작전이 벌어졌다. 민간인과 군인 희생자가 나왔다."],
  ["경제 · 12.12","OECD 가입, 29번째 회원국","‘선진국 클럽’ 가입에 축포가 터졌지만 이듬해 외환위기로 성급한 자본시장 개방이었다는 비판을 받게 된다."],
  ["스포츠 · 5.31","2002 월드컵 한·일 공동개최 확정","FIFA 집행위원회가 공동개최를 결정. 아시아 첫 월드컵이자 사상 첫 공동개최였다."],
  ["노동 · 12.26","노동법·안기부법 새벽 날치기","여당 단독으로 7분 만에 처리. 민주노총·한국노총 총파업으로 번지며 이듬해 재개정에 이른다."],
  ["정치 · 4.11","15대 총선, 신한국당 원내 1당","과반에는 못 미쳤지만 139석으로 1당을 지켰다. 이후 무소속·야당 영입으로 과반을 만들었다."],
  ["사회 · 8월","연세대 한총련 사태","통일대축전을 둘러싼 대치 끝에 5,800여 명이 연행됐다. 학생운동이 급격히 쇠퇴하는 계기가 됐다."],
  ["IT · 1월","CDMA 세계 최초 상용화","정부·연구소·기업이 함께 개발한 디지털 이동통신이 세계 처음 상용화됐다. 이동통신 강국의 출발점."],
  ["재해 · 7월","경기 북부 집중호우","철원·연천 일대에 사흘간 700mm가 넘는 비가 쏟아져 수십 명이 숨지고 군부대도 큰 피해를 입었다."],
  ["스포츠 · 7~8월","애틀랜타 올림픽 종합 10위","금 7, 은 15, 동 5. 배드민턴 혼합복식·양궁 등에서 금메달을 따냈다."]
 ]},
{y:1997, no:"제5호", motto:"국가 부도의 해",
 lead:{kicker:"경제 · 11월 21일", h:"정부, IMF에 구제금융 공식 요청", deck:"외환보유액 바닥… 12월 3일 사상 최대 규모 지원 협약, ‘IMF 시대’ 개막",
  body:"임창열 경제부총리가 국제통화기금(IMF)에 긴급자금 지원을 요청한다고 발표했다. 연초 한보·삼미·진로·기아로 이어진 대기업 연쇄 부도와 동남아 외환위기가 겹치며 외국 자본이 썰물처럼 빠져나간 결과였다. 원·달러 환율은 연말 1,900원대까지 치솟았고, 고금리·구조조정·대량 실업이 일상이 됐다. 한국 사회의 고용과 가족, 가치관을 통째로 바꾼 분기점이다.",
  fig:["1,964원","원·달러 환율 연중 최고 (12.23)"], quote:["가용 외환보유액 39억 달러","12월 18일, 바닥을 드러낸 나라 곳간"]},
 items:[
  ["정치 · 12.18","김대중 15대 대통령 당선","DJP 연합으로 이회창 후보를 39만 표 차로 눌렀다. 헌정사 첫 선거에 의한 여야 정권교체."],
  ["경제 · 1.23","한보철강 부도, 김현철 구속","5조 원대 부실 대출 뒤 정·관계 로비가 드러났다. 대통령 차남이 5월 구속돼 현직 대통령 아들 구속은 처음이었다."],
  ["경제 · 7.15","기아그룹 부도유예협약","재계 8위 기아의 좌초로 대외 신인도가 급락했다. 외환위기의 결정적 방아쇠로 꼽힌다."],
  ["사고 · 8.6","대한항공 801편 괌 추락","괌 공항 접근 중 니미츠 힐에 추락해 228명이 숨졌다. 국적기 사고 중 최악의 인명피해."],
  ["북한 · 2.12","황장엽 북 노동당 비서 망명","주체사상 이론가가 베이징 한국총영사관에 망명을 신청했다. 북한 최고위급 인사의 첫 망명."],
  ["노동 · 1월","노동법 총파업","날치기 처리에 항의한 총파업이 한 달 가까이 이어졌고 3월 노동법은 여야 합의로 재개정됐다."],
  ["사법 · 4.17 / 12.22","전두환·노태우 형 확정 후 특별사면","대법원이 무기징역·징역 17년을 확정했다. 연말 대통령 당선인 협의를 거쳐 특별사면됐다."],
  ["스포츠 · 9.28","‘도쿄대첩’ 일본에 2-1 역전승","프랑스 월드컵 최종예선 원정에서 역전승을 거두며 4회 연속 본선행의 발판을 놓았다."],
  ["사회 · 2.15","이한영 피격 사건","김정일 전처 성혜림의 조카로 귀순한 이한영 씨가 분당 자택 앞에서 북한 공작원 총격에 숨졌다."]
 ]},
{y:1998, no:"제6호", motto:"금을 모아 나라를 일으키다",
 lead:{kicker:"정치 · 2월 25일", h:"‘국민의 정부’ 출범, 첫 평화적 정권교체", deck:"김대중 대통령 취임… “민주주의와 시장경제 병행 발전”으로 위기 극복 선언",
  body:"건국 50년 만에 선거로 야당 후보가 정권을 넘겨받았다. 새 정부의 첫 과제는 외환위기 수습이었다. 노사정위원회를 통한 정리해고제 도입, 부실 은행 퇴출, 대기업 ‘빅딜’ 등 고강도 구조조정이 숨 가쁘게 진행됐다. 그 과정에서 실업자는 이듬해 초 170만 명을 넘어섰고 경제는 마이너스 성장을 기록했지만, 외환보유액이 빠르게 회복되며 반전의 실마리를 잡았다.",
  fig:["227톤","금 모으기 운동으로 모인 금 (약 351만 명 참여)"], quote:["“민주주의와 시장경제는 동전의 앞뒷면과 같습니다.”","취임사 중 (요지)"]},
 items:[
  ["사회 · 1~3월","전국 금 모으기 운동","돌반지와 결혼반지까지 내놓은 국민 운동. 세계 언론이 한국인의 위기 극복 의지에 주목했다."],
  ["경제 · 6.29","5개 은행 퇴출, 대규모 구조조정","대동·동남·동화·경기·충청은행이 퇴출됐다. 이후 기업 빅딜과 대우 위기로 이어지는 재편의 시작."],
  ["노동 · 2월","노사정 합의, 정리해고제 도입","노사정위원회 대타협으로 정리해고와 근로자 파견제가 도입됐다. ‘평생직장’ 개념이 무너졌다."],
  ["북한 · 6.16","정주영 회장 소떼 방북","소 500마리를 실은 트럭과 함께 판문점을 넘었다. 10월 2차 501마리로 이어지며 민간 교류의 물꼬를 텄다."],
  ["북한 · 11.18","금강산 관광선 첫 출항","현대금강호가 동해항을 떠나며 분단 후 처음 일반인의 북한 관광이 시작됐다."],
  ["스포츠 · 7.6","박세리 US여자오픈 우승","연장 끝 연못가 ‘맨발 샷’으로 우승. IMF로 지친 국민에게 가장 큰 위로가 된 장면이다."],
  ["노동 · 7~8월","현대자동차 정리해고 분규","대규모 정리해고에 맞선 파업과 공장 점거가 이어지다 해고 규모를 줄이는 선에서 타결됐다."],
  ["재해 · 7.31~8월","지리산 폭우·수도권 집중호우","지리산 야영객이 휩쓸려 사망·실종하는 등 여름 내내 이어진 집중호우로 300명이 넘는 인명피해가 났다."],
  ["문화 · 10.20","일본 대중문화 1차 개방","김대중-오부치 공동선언 직후 일본 영화 일부를 시작으로 단계적 개방에 들어갔다."]
 ]},
{y:1999, motto:"서해의 포성, 재벌의 몰락",
 lead:{kicker:"안보 · 6월 15일", h:"연평도 앞바다 남북 교전… 북 어뢰정 격침", deck:"꽃게잡이 철 북방한계선 침범한 북 경비정과 충돌, 정전 이후 첫 정규 해군 교전",
  body:"서해 연평도 서쪽 해상에서 북방한계선(NLL)을 넘어온 북한 경비정과 어뢰정이 우리 해군 고속정과 교전을 벌였다. 북측이 먼저 사격하자 우리 해군이 즉각 대응해 북한 어뢰정 1척을 격침하고 경비정 여러 척을 대파했다. 정전협정 이후 남북 정규 해군 간 첫 교전으로, 같은 시기 진행되던 햇볕정책과 대북 교류의 앞날에 커다란 물음표를 남겼다.",
  fig:["14분","교전 시간"], quote:["북 어뢰정 1척 격침, 경비정 5척 대파","제1연평해전 우리 군 전과"]},
 items:[
  ["경제 · 8.26","대우그룹 워크아웃, 해체 수순","재계 2위 대우의 12개 계열사가 워크아웃에 들어갔다. ‘세계경영’ 신화가 무너지며 구조조정의 상징이 됐다."],
  ["사고 · 6.30","화성 씨랜드 수련원 화재","잠자던 유치원생 19명 등 23명이 숨졌다. 불법 컨테이너 숙소와 관리 부실이 드러났다."],
  ["사고 · 10.30","인천 인현동 호프집 화재","축제 뒤풀이를 하던 청소년 등 57명이 숨졌다. 출입문을 막은 업주와 단속 공무원 유착이 밝혀졌다."],
  ["정치 · 5월~","‘옷 로비’ 의혹 파문","재벌 회장 부인이 장관 부인들에게 고급 옷을 건넸다는 의혹. 첫 특별검사 도입으로 이어졌다."],
  ["경제 · 1999년","코스닥·벤처 열풍","인터넷 기업 주가가 수십 배씩 뛰며 벤처 창업 붐이 일었다. 이듬해 거품 붕괴의 전조이기도 했다."],
  ["경제 · 연간","외환위기 1년 만에 10%대 성장","전년 마이너스 성장에서 V자로 반등했다. 외환보유액도 700억 달러를 넘겨 위기 탈출을 알렸다."],
  ["경제 · 6.30","삼성자동차 법정관리","빅딜 협상이 무산되며 삼성차가 법정관리를 신청했다. 부산 공장은 이듬해 르노에 넘어갔다."],
  ["사회 · 6월","조폐공사 파업유도 의혹","검찰 간부의 ‘파업 유도’ 발언이 공개되며 두 번째 특검이 도입됐다."],
  ["사회 · 12월","Y2K 대란 우려","2000년 날짜 인식 오류에 대비해 금융·전력 비상근무가 이어졌다. 실제 큰 장애는 없었다."]
 ]},
{y:2000, motto:"평양으로 간 대통령",
 lead:{kicker:"남북 · 6월 13일", h:"분단 55년, 첫 남북정상회담", deck:"김대중-김정일 평양 순안공항서 악수… 6·15 남북공동선언 발표",
  body:"김대중 대통령이 평양을 방문해 김정일 국방위원장과 사흘간 회담했다. 두 정상은 이산가족 상봉, 경제협력, 통일 방안의 공통점 인정 등을 담은 6·15 남북공동선언에 서명했다. 순안공항에서 두 정상이 손을 맞잡는 장면은 전국에 생중계됐고, 이후 이산가족 상봉과 금강산·개성 사업 등 교류가 본격화됐다.",
  fig:["55년","분단 후 첫 정상 만남"], quote:["6·15 남북공동선언 5개 항 합의","6월 15일 평양"]},
 items:[
  ["외교 · 10.13","김대중 대통령 노벨평화상","한국인 최초 노벨상 수상. 민주주의와 인권, 남북 화해에 기여한 공로를 인정받았다."],
  ["남북 · 8.15","분단 후 첫 서울·평양 이산가족 교환 상봉","100명씩 서울과 평양을 오가며 50년 만에 가족을 만났다. 눈물바다가 생중계됐다."],
  ["의료 · 7월","의약분업 시행, 의료계 집단 휴진","진료는 의사, 조제는 약사로 나누는 제도 시행을 앞뒤로 의사들이 여러 차례 진료를 거부했다."],
  ["정치 · 4.13","16대 총선, 시민단체 낙선운동","총선시민연대가 공천 부적격자 명단을 발표했고, 낙선 대상자 다수가 실제로 떨어졌다."],
  ["경제 · 11.8","대우자동차 최종 부도","포드 인수 무산 끝에 부도 처리됐다. 2차 금융 구조조정과 공적자금 추가 투입이 이어졌다."],
